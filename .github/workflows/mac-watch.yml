name: mac-watch

# 自宅Mac（Claude Code の作業機）の見張り（2026-10-11 追加）
# - Mac は15分ごとに heartbeat ブランチへ空コミットを force-push する（~/bin/mac_heartbeat.sh・launchd）
# - ここでは15分ごとに heartbeat の最終時刻を見て、45分以上途絶えていたら LINE で知らせる
#   （停電・Wi-Fi切れ・スリープ・Mac停止など。GitHub の cron は遅れることがあるので、
#    「同じ途絶えには1回だけ」を watch-state ブランチに記録して重複送信を防ぐ）
# - 途絶えが6時間を超えたら、もう一度だけ念押しを送る
# - Mac 側から alert ブランチへ push されたら、そのコミットメッセージを LINE で送る
#   （Claudeアプリが止まっている／復旧した、など）
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [alert]
  workflow_dispatch:
    inputs:
      test:
        description: "テスト送信するなら yes"
        required: false

permissions:
  contents: write

concurrency:
  group: mac-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 送信関数
        run: |
          cat > /tmp/send.py <<'EOF'
          import json, os, sys, urllib.request
          text = sys.stdin.read().strip()
          tok = os.environ["LINE_CHANNEL_TOKEN"].strip()
          req = urllib.request.Request("https://api.line.me/v2/bot/message/broadcast",
              data=json.dumps({"messages": [{"type": "text", "text": text[:4900]}]}).encode(),
              headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=20).status)
          EOF

      - name: Mac からの知らせ（alert ブランチへの push）
        if: github.event_name == 'push'
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: git log -1 --format=%B | python3 /tmp/send.py

      - name: テスト送信
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'yes'
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: echo "【Mac見張り】テスト通知です。Macとの接続が切れたら、ここに届きます。" | python3 /tmp/send.py

      - name: 途絶えの確認
        if: github.event_name == 'schedule'
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          git fetch -q origin heartbeat watch-state || true
          hb=$(git log -1 --format=%ct origin/heartbeat 2>/dev/null || echo 0)
          [ "$hb" = "0" ] && { echo "heartbeat なし"; exit 0; }
          now=$(date +%s); age=$(( (now - hb) / 60 ))
          last=$(TZ=Asia/Tokyo date -d @"$hb" '+%-m/%-d %H:%M')
          state=$(git show origin/watch-state:state.txt 2>/dev/null || echo "alerted=0 reminded=0")
          alerted=$(echo "$state" | sed -n 's/.*alerted=\([0-9]*\).*/\1/p'); reminded=$(echo "$state" | sed -n 's/.*reminded=\([0-9]*\).*/\1/p')
          echo "last=$last age=${age}min state=$state"
          msg=""
          if [ "$age" -ge 360 ] && [ "$reminded" != "$hb" ]; then
            msg="【Mac見張り】まだMacから応答がありません（最後の応答 ${last}・約$((age/60))時間前）。電源・Wi-Fi・ふたが閉じていないかを見てください。"
            reminded=$hb; alerted=$hb
          elif [ "$age" -ge 45 ] && [ "$alerted" != "$hb" ]; then
            msg="【Mac見張り】自宅Macからの応答が${age}分途絶えています（最後の応答 ${last}）。携帯からClaudeに指示が届かない可能性があります。停電・Wi-Fi・スリープ・ふた閉じを確認してください。"
            alerted=$hb
          fi
          [ -z "$msg" ] && exit 0
          echo "$msg" | python3 /tmp/send.py
          git config user.name "mac-watch"; git config user.email "mac-watch@users.noreply.github.com"
          git checkout -q --orphan ws && git rm -rq --cached . && echo "alerted=$alerted reminded=$reminded" > state.txt
          git add state.txt && git commit -qm "watch-state" && git push -qf origin HEAD:watch-state
