name: mac-watch

# 自宅Mac（Claude Code の作業機）の見張り（2026-10-11 追加）
# - Mac は15分ごとに heartbeat ブランチへ空コミットを force-push する（~/bin/mac_heartbeat.sh・launchd）
# - ここでは15分ごとに heartbeat の最終時刻を見て、45分以上途絶えていたら LINE で知らせる
#   （停電・Wi-Fi切れ・スリープ・Mac停止など。GitHub の cron は遅れることがあるので、
#    「同じ途絶えには1回だけ」を watch-state ブランチに記録して重複送信を防ぐ）
# - 途絶えが6時間を超えたら、もう一度だけ念押しを送る
# - Mac 側が alert ブランチへ push した知らせ（Claudeアプリ停止／復旧など）も、15分ごとの確認で LINE に送る
#   （alert ブランチの中身は空なので push トリガーは使えない＝workflow ファイルが無いため）
on:
  schedule:
    - cron: "7,37 * * * *"   # 毎時ちょうどは混んで数時間遅れるので避ける
  workflow_dispatch:
    inputs:
      test:
        description: "テスト送信するなら yes"
        required: false

permissions:
  contents: write

concurrency:
  group: mac-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 送信関数
        run: |
          cat > /tmp/send.py <<'EOF'
          import json, os, sys, urllib.request
          text = sys.stdin.read().strip()
          tok = os.environ["LINE_CHANNEL_TOKEN"].strip()
          req = urllib.request.Request("https://api.line.me/v2/bot/message/broadcast",
              data=json.dumps({"messages": [{"type": "text", "text": text[:4900]}]}).encode(),
              headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=20).status)
          EOF

      - name: テスト送信
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'yes'
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: echo "【Mac見張り】テスト通知です。Macとの接続が切れたら、ここに届きます。" | python3 /tmp/send.py

      - name: 途絶えと知らせの確認
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          # cron は遅れるので、1回起動したら中で5分おきに確認し続ける（約5.5時間。次のcronが控えで待つ）
          git config user.name "mac-watch"; git config user.email "mac-watch@users.noreply.github.com"
          check() {
            git fetch -q origin heartbeat watch-state alert || true
            state=$(git show origin/watch-state:state.txt 2>/dev/null || echo "")
            get(){ echo "$state" | tr ' ' '\n' | sed -n "s/^$1=//p"; }
            alerted=$(get alerted); reminded=$(get reminded); asent=$(get alert_sent)
            changed=0
            # Mac からの知らせ（alert ブランチ）。初回は送らずに基準だけ記録する
            ash=$(git rev-parse -q --verify origin/alert 2>/dev/null || echo none)
            if [ "$ash" != "none" ] && [ "$ash" != "$asent" ]; then
              if [ -n "$asent" ]; then git log -1 --format=%B "$ash" | python3 /tmp/send.py; fi
              asent=$ash; changed=1
            fi
            # heartbeat の途絶え
            hb=$(git log -1 --format=%ct origin/heartbeat 2>/dev/null || echo 0)
            if [ "$hb" != "0" ]; then
              now=$(date +%s); age=$(( (now - hb) / 60 ))
              last=$(TZ=Asia/Tokyo date -d @"$hb" '+%-m/%-d %H:%M')
              echo "last=$last age=${age}min"
              msg=""
              if [ "$age" -ge 360 ] && [ "$reminded" != "$hb" ]; then
                msg="【Mac見張り】まだMacから応答がありません（最後の応答 ${last}・約$((age/60))時間前）。電源・Wi-Fi・ふたが閉じていないかを見てください。"
                reminded=$hb; alerted=$hb
              elif [ "$age" -ge 45 ] && [ "$alerted" != "$hb" ]; then
                msg="【Mac見張り】自宅Macからの応答が${age}分途絶えています（最後の応答 ${last}）。携帯からClaudeに指示が届かない可能性があります。停電・Wi-Fi・スリープ・ふた閉じを確認してください。"
                alerted=$hb
              fi
              if [ -n "$msg" ]; then echo "$msg" | python3 /tmp/send.py; changed=1; fi
            fi
            [ "$changed" = 0 ] && return 0
            d=$(mktemp -d); echo "alerted=$alerted reminded=$reminded alert_sent=$asent" > "$d/state.txt"
            blob=$(git hash-object -w "$d/state.txt"); tree=$(printf '100644 blob %s\tstate.txt\n' "$blob" | git mktree)
            c=$(git commit-tree "$tree" -m watch-state); git push -qf origin "$c:refs/heads/watch-state"
          }
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            check || echo "check failed"
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && break
            sleep 300
          done
